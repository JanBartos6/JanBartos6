name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [card.json, ascii_dark.txt, ascii_light.txt, "scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats
        run: python scripts/update_stats.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
      - name: Render cards
        run: |
          python scripts/render.py
          python scripts/render_session.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json dark_mode.svg light_mode.svg session_dark.svg session_light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile card stats"
            git push
          fi
